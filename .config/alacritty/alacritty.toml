# ━━━━┫ General ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[general]
live_config_reload = true
working_directory = "None"
ipc_socket = true

import = [
    "~/.config/alacritty/themes/kimbie.toml",
    "~/.config/alacritty/bindings/hints.toml"
    # "~/.config/alacritty/bindings/keyboard.toml",
    # "~/.config/alacritty/bindings/mouse.toml",
]

# ━━━━┫ Bell ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[bell]
animation = "EaseOutExpo"
color = "#ffffff"
duration = 1

# ━━━━┫ Cursor ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[cursor]
blink_interval   = 750
blink_timeout    = 5
thickness        = 0.15
unfocused_hollow = true
style =         { shape = "Block", blinking = "Always" }
vi_mode_style = { shape = "Block", blinking = "Always" }

# ━━━━┫ Debug ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[debug]
log_level          = "Warn"
print_events       = false
render_timer       = false
highlight_damage   = false
persistent_logging = false

# ━━━━┫ Environment ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[env]
TERM = "alacritty"

# ━━━━┫ Font ┣━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

[font]
size = 13
builtin_box_drawing = true

normal      = { family = "FiraCode Nerd Font Mono", style = "Medium" }
bold        = { family = "FiraCode Nerd Font Mono", style = "Bold" }
italic      = { family = "FiraCode Nerd Font Mono", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font Mono", style = "Bold Italic" }

glyph_offset = { x = 0, y = 0 }
offset       = { x = -1, y = -1 }
# offset     = { x = -1, y = 0 }

# --------------------------------

# normal = { family = "FiraMono Nerd Font Mono", style = "Regular" }
# bold = { family = "FiraMono Nerd Font Mono", style = "Bold" }
# italic = { family = "FiraMono Nerd Font Mono", style = "Italic" }
# bold_italic = { family = "FiraMono Nerd Font Mono", style = "Bold Italic" }
# size = 14
# glyph_offset = { x = 0, y = 0 }
# offset = { x = -1, y = -1 }

# --------------------------------

# bold = { family = "GeistMono Nerd Font Mono", style = "Bold" }
# normal = { family = "GeistMono Nerd Font Mono", style = "Regular" }
# italic = { family = "GeistMono Nerd Font Mono", style = "Italic" }
# bold_italic = { family = "GeistMono Nerd Font Mono", style = "Bold Italic" }

#  ╭───────────╮
#  │ Scrolling │
#  ╰───────────╯

[scrolling]
history = 15000
multiplier = 1

#  ╭────────╮
#  │ Window │
#  ╰────────╯

[window]
decorations = "full"
decorations_theme_variant = "Dark"
dynamic_padding = true
dynamic_title = true
opacity = 0.9
resize_increments = true
startup_mode = "Windowed"
title = "Alacritty"

[window.class]
general = "Alacritty"
instance = "Alacritty"

[window.dimensions]
columns = 0
lines = 0

[window.padding]
x = 2
y = 2

#  ╭───────╮
#  │ Other │
#  ╰───────╯
[selection]
save_to_clipboard = true
semantic_escape_chars = """,│`|:"' ()[]{}<>\t"""

