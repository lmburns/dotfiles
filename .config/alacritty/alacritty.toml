# ══════════════════════════════════════════════════════════════════════
# ══ module: alacritty/bindings/mouse.toml ═════════════════════════════
# ══════════════════════════════════════════════════════════════════════

[mouse]
hide_when_typing = false

bindings = [
    { action = "Copy"           , mouse = "Middle" },
    { action = "Copy"           , mods = "Alt"      , mouse = "Middle" },
    { action = "PasteSelection" , mode = "~Vi"      , mouse = "Middle" },
    { action = "ClearSelection" , mode = "~Vi"      , mouse = "Right" },
    { action = "Open"           , mode = "Vi"       , mods = "Alt", mouse = "Right" },
    { action = "ExpandSelection", mouse = "Right" } ,
    { action = "ExpandSelection", mods = "Control"  , mouse = "Right" }
]

# ══════════════════════════════════════════════════════════════════════
# ══ module: alacritty/bindings/keyboard.toml ══════════════════════════
# ══════════════════════════════════════════════════════════════════════
#
[keyboard]
#
# VirtualKeyCodes
# https://docs.rs/winit/latest/winit/event/enum.VirtualKeyCode.html
#
# Scancodes
# https://www.win.tue.nl/~aeb/linux/kbd/scancodes-1.html
#
# Keycodes
#  - sudo dumpkeys -l
# Keycodes
#  - sed -n l
# Example to get this info for double quote:
#
#   { key: 0x28, mods: Alt|Shift, chars: "\x1b[34;4u" }:
#
#  1. key:   Output of `sudo showkey --scancode`.                     = 0x28
#  2. chars: Output of `sudo showkey --ascii`. First column           = 34
#            or Output of `xev`'s 'keysym' (0x22). Convert 0x22 to decimal
#  3. chars: After the semicolon, see table below.
#
# https://www.eso.org/~ndelmott/ascii.html
# The actual modifier is a result of 1 + modifier
# For example, Control|Alt = 4 + 2 + 1
#
# shift     0b1         (1)
# alt       0b10        (2)
# ctrl      0b100       (4)
# super     0b1000      (8)
# hyper     0b10000     (16)
# meta      0b100000    (32)
# caps_lock 0b1000000   (64)
# num_lock  0b10000000  (128)
#
# Shift                    = 2
# Alt/Option               = 3
# Alt/Option + Shift       = 4
# Control                  = 5
# Control + Shift          = 6
# Control + Alt/Option     = 7
# Control + Alt + Shift    = 8

bindings = [
    { key = "Equals"        , mods = "Control|Alt"  ,      action = "ResetFontSize"    },
    { key = "Plus"          , mods = "Control|Shift",      action = "IncreaseFontSize" },
    { key = 12              , mods = "Control|Shift",      action = "DecreaseFontSize" },
    { key = "Numpad0"       , mods = "Control|Alt"  ,      action = "ResetFontSize"    },
    { key = "NumpadAdd"     , mods = "Control"      ,      action = "IncreaseFontSize" },
    { key = "NumpadSubtract", mods = "Control"      ,      action = "DecreaseFontSize" },
    { key = "Period"        , mods = "Control|Alt|Super",  action = "CreateNewWindow" },
    { key = "Comma"        ,  mods = "Control|Alt|Super",  action = "SpawnNewInstance"  },
    { key = "NumpadEquals",   mods = "Control|Alt|Super",  action = "ClearHistory" },
    { key = "NumpadEnter",    mods = "Control|Alt|Super",  action = "ClearLogNotice" },

    # FIX:
    { key = "PageUp",   mods = "Shift",  mode = "~Alt",  action = "ScrollPageUp" },
    { key = "PageDown", mods = "Shift",  mode = "~Alt",  action = "ScrollPageDown" },
    { key = "Home",     mods = "Shift",  mode = "~Alt",  action = "ScrollToTop" },
    { key = "End",      mods = "Shift",  mode = "~Alt",  action = "ScrollToBottom" },

    # Arch ONLY
    { key = "P"     , mods = "Control"      ,                    action = "Paste"       },

    { key = "Key0"  , mods = "Control"      ,                    action = "ReceiveChar" },
    { key = "Equals", mods = "Control"      ,                    action = "ReceiveChar" },
    { key = "Plus"  , mods = "Control"      ,                    action = "ReceiveChar" },
    { key = "Minus" , mods = "Control"      ,                    action = "ReceiveChar" },
    { key = "F"     , mods = "Control|Shift", mode = "~Search" , action = "ReceiveChar" },
    { key = "B"     , mods = "Control|Shift", mode = "~Search" , action = "ReceiveChar" },

    # -- Shift + <char> ----------------------------------------------------
    { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
    # { key = "Space", mods = "Shift", chars = "\u001B[32;2u" },

    # -- Control + <letter> ------------------------------------------------
    { key = "H"        , mods = "Control", chars = "\u001B[104;5u" },
    { key = "I"        , mods = "Control", chars = "\u001B[105;5u" },
    { key = "J"        , mods = "Control", chars = "\u001B[106;5u" },
    { key = "M"        , mods = "Control", chars = "\u001B[109;5u" },
    { key = "Return"   , mods = "Control", chars = "\u001B[13;5u" },
    { key = "`"        , mods = "Control", chars = "\u001B[96;5u" }, # Grave
    { key = "Minus"    , mods = "Control", chars = "\u001B[45;5u" },
    { key = "Equals"   , mods = "Control", chars = "\u001B[61;5u" },
    { key = "LBracket" , mods = "Control", chars = "\u001B[91;5u" },
    { key = "RBracket" , mods = "Control", chars = "\u001B[93;5u" },
    { key = "Backslash", mods = "Control", chars = "\u001B[92;5u" },
    { key = "'"        , mods = "Control", chars = "\u001B[39;5u" }, # Apostrophe
    { key = "Comma"    , mods = "Control", chars = "\u001B[44;5u" },
    { key = "Period"   , mods = "Control", chars = "\u001B[46;5u" },
    { key = 53         , mods = "Control", chars = "\u001B[31;5u" }, # Forward slash (/)

    # -- Control + Alt + <letter> ------------------------------------------
    { key = "I"        , mods = "Control|Alt", chars = "\u001B[105;7u" },
    { key = "O"        , mods = "Control|Alt", chars = "\u001B[111;7u" },
    # { key = "M",     mods = "Control|Alt", chars = "\u001B[109;7u" } # TODO:
    # { key = "Space", mods = "Control|Alt", chars = "\u001B[32;7u" }
    { key = "Return"   , mods = "Control|Alt", chars = "\u001B[13;7u" },
    { key = "`"        , mods = "Control|Alt", chars = "\u001B[96;7u" }, # Grave
    { key = "Minus"    , mods = "Control|Alt", chars = "\u001B[45;7u" },
    { key = "Equals"   , mods = "Control|Alt", chars = "\u001B[61;7u" },
    { key = "LBracket" , mods = "Control|Alt", chars = "\u001B[91;7u" },
    { key = "RBracket" , mods = "Control|Alt", chars = "\u001B[93;7u" },
    { key = "Backslash", mods = "Control|Alt", chars = "\u001B[92;7u" },
    { key = "Semicolon", mods = "Control|Alt", chars = "\u001B[59;7u" },
    { key = "'"        , mods = "Control|Alt", chars = "\u001B[39;7u" }, # Apostrophe
    { key = "Comma"    , mods = "Control|Alt", chars = "\u001B[44;7u" },
    { key = "Period"   , mods = "Control|Alt", chars = "\u001B[46;7u" },
    { key = 53         , mods = "Control|Alt", chars = "\u001B[31;7u" }, # Forward slash (/)

    # -- Control + Alt + Shift + <letter> ----------------------------------
    # Control + Alt + Shift + C ⇒ Copy link
    # Control + Alt + Shift + O ⇒ Open link
    # Control + Alt + Shift + Y ⇒ Copy path

    { key = "A", mods = "Control|Alt|Shift", chars = "\u001B[97;8u" },
    { key = "B", mods = "Control|Alt|Shift", chars = "\u001B[98;8u" },
    # { key = "C", mods = "Control|Alt|Shift", chars = "\u001B[99;8u" },
    { key = "D", mods = "Control|Alt|Shift", chars = "\u001B[100;8u" },
    { key = "E", mods = "Control|Alt|Shift", chars = "\u001B[101;8u" },
    { key = "F", mods = "Control|Alt|Shift", chars = "\u001B[102;8u" },
    { key = "G", mods = "Control|Alt|Shift", chars = "\u001B[103;8u" },
    { key = "H", mods = "Control|Alt|Shift", chars = "\u001B[104;8u" },
    { key = "I", mods = "Control|Alt|Shift", chars = "\u001B[105;8u" },
    { key = "J", mods = "Control|Alt|Shift", chars = "\u001B[106;8u" },
    { key = "K", mods = "Control|Alt|Shift", chars = "\u001B[107;8u" },
    { key = "L", mods = "Control|Alt|Shift", chars = "\u001B[108;8u" },
    { key = "M", mods = "Control|Alt|Shift", chars = "\u001B[109;8u" },
    { key = "N", mods = "Control|Alt|Shift", chars = "\u001B[110;8u" },
    # { key = "O", mods = "Control|Alt|Shift", chars = "\u001B[111;8u" },
    { key = "P", mods = "Control|Alt|Shift", chars = "\u001B[112;8u" },
    { key = "Q", mods = "Control|Alt|Shift", chars = "\u001B[113;8u" },
    { key = "R", mods = "Control|Alt|Shift", chars = "\u001B[114;8u" },
    { key = "S", mods = "Control|Alt|Shift", chars = "\u001B[115;8u" },
    { key = "T", mods = "Control|Alt|Shift", chars = "\u001B[116;8u" },
    { key = "U", mods = "Control|Alt|Shift", chars = "\u001B[117;8u" },
