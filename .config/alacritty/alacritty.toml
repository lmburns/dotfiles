    { key = "X", mods = "Control|Alt|Shift", chars = "\u001B[120;8u" },
    # { key = "Y", mods = "Control|Alt|Shift", chars = "\u001B[121;8u" },
    { key = "Z", mods = "Control|Alt|Shift", chars = "\u001B[122;8u" },

    { key = "Return", mods = "Control|Alt|Shift", chars = "\u001B[13;8u" },
    { key = 41, mods = "Control|Alt|Shift", chars = "\u001B[126;8u" }, # 0x29 Tilde
    { key = 2 , mods = "Control|Alt|Shift", chars = "\u001B[33;8u" },  # 0x02 Exclamation
