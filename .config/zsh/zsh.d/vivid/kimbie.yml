core:
  normal_text: { foreground: fg0 }
  regular_file: { foreground: fg0 }
  directory: { foreground: teaberry, font-style: bold }
  symlink: { foreground: phillipine_green, font-style: underline }
  multi_hard_link: { foreground: flush_orange, font-style: underline }
  broken_symlink: { foreground: fg3, background: red, font-style: bold }
  missing_symlink_target: { foreground: red, background: fg3, font-style: bold }
  executable_file: { foreground: bright_green, font-style: bold }

  fifo: { foreground: yellow }
  socket: { foreground: magenta, font-style: bold }
  door: { foreground: pretty_prune, font-style: bold }

  block_device: { foreground: orange, font-style: bold }
  character_device: { foreground: orange, font-style: bold }
  setuid: { foreground: ballerina_tutu, font-style: bold }
  setgid: { foreground: philippine_silver, font-style: bold }

  sticky: { foreground: fuzzy_wuzzy, font-style: bold }
  sticky_other_writable: { foreground: fuzzy_wuzzy, font-style: bold }
  file_with_capability: { foreground: begonia, font-style: bold }
  other_writable: {}
  reset_to_normal: { foreground: fg0 }

text:
  other: { foreground: purple }
  git: { foreground: jasper_orange }
  repo: { foreground: russian_green }
  info: { foreground: wave_red, font-style: bold }
  statement: { foreground: fuzzy_wuzzy, font-style: bold }
  news: { foreground: deep_lilac }
  contributors: { foreground: glorious_sunset }
  special: { foreground: magenta }
  repo-misc: { foreground: beaver }
  license: { foreground: aqua }
  todo: { foreground: amaranth_purple, font-style: bold }
  cert: { foreground: morning_blue }
  gpg: { foreground: aqua }

  arch: { foreground: cranberry_sauce }
  data: { foreground: beaver }
  misc: { foreground: light_taupe }

  configuration:
    foreground: yellow
    font-style: bold

    generic: { foreground: yellow }
    metadata: { foreground: yellow }
    bibtex: { foreground: yellow }
    dockerfile: { foreground: yellow }
    snippet: { foreground: amethyst }
    nix: { foreground: yellow }
    qt: { foreground: yellow }
    mail: { foreground: yellow }
    desktop: { foreground: yellow }
    system: { foreground: sea_green }
    systemd: { foreground: sea_green }
    crontab: { foreground: yellow }
    zshrc: { foreground: magenta, font-style: bold }
    bashrc: { foreground: magenta, font-style: bold }
    csh: { foreground: magenta, font-style: bold }
    vim: { foreground: citron, font-style: bold }
    taskwarrior: { foreground: lusty_lavender }
    gpg: { foreground: cure_all }
    keybind: { foreground: yellow }
    x11: { foreground: mulled_wine }
    rc: { foreground: lusty_lavender }

markup:
  foreground: blue
  web: { foreground: blue }
  markdown: { foreground: blue_marguerite }
  table: { foreground: med_green }
  sublime: { foreground: russian_green }

programming:
  source:
    foreground: glorious_sunset
    python: { foreground: green }
    ruby: { foreground: darker_red }
    rust: { foreground: salmon }
    lua: { foreground: slate_gray }
    teal: { foreground: wave_red }
    javascript: { foreground: yellow }
    zsh: { foreground: dark_magenta }
    solidity: { foreground: magenta }
    scheme: { foreground: amaranth_purple }
    graphql: { foreground: aqua }
    protobuf: { foreground: tuscan_red }

  main: { foreground: peach_red, font-style: bold }
  common: { foreground: puce }
  utils: { foreground: puce }
  config: { foreground: sea_green }

  ignore: { foreground: coconut }

  tooling:
    foreground: orange
    packaging:
      foreground: orange
      ruby: { foreground: green }
      lua: { foreground: peach_red }
      rust: { foreground: yellow, font-style: bold }
      ecma: { foreground: yellow, font-style: bold }
    code-style:
      foreground: fuzzy_wuzzy
    lsp:
      foreground: vista_blue

    vcs:
      foreground: orange

    documentation:
      foreground: orange
      tag: { foreground: glorious_sunset }

    build:
      foreground: green
      font-style: bold
      configure:
        foreground: orange
      make-extra:
        foreground: med_green

    continuous-integration:
      foreground: bright_green

media:
  image:
    foreground: magenta
  gif:
    foreground: surimi_orange
  audio:
    foreground: yellow
  video:
    foreground: green
  fonts:
    foreground: phillipine_green

office:
  foreground: aqua
  font-style: bold
  pdf:
    foreground: dark_magenta
    font-style: bold

archives:
  foreground: purple
  font-style: bold

executable:
  foreground: bright_green

unimportant:
  foreground: darkgrey
  partial:
    crdownload: { foreground: darker_red }

macos:
  foreground: red

torrent:
  foreground: amaranth_purple
